name: catzconnect
description: "Catz Connect SDK for Flutter: encrypted send for Email, SMS, WhatsApp, Push and Voice, WebRTC voice and video calls, and app keys."
version: 2.0.0
homepage: https://catzconnect.com
repository: https://github.com/Catalizo/catzconnect-dart-sdk

environment:
  # sodium 4.1 needs Dart 3.13 (Flutter 3.47) for its native-assets build hooks.
  sdk: '>=3.13.0 <4.0.0'
  flutter: '>=3.47.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_webrtc: ^1.0.0
  web_socket_channel: ^3.0.0
  # libsodium. Since 4.0 its build hooks build and bundle the native library
  # for Android, iOS, macOS, Linux and Windows (sodium_libs is discontinued);
  # on the web it uses sodium.js (`dart run sodium:update_web`).
  sodium: ^4.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  # A plugin since 2.0.0, for app keys: Play Integrity (Android) and App
  # Attest (iOS) over the `catzconnect/attest` method channel. Apps that only
  # use server keys, the call client or the push helpers need nothing new.
  plugin:
    platforms:
      android:
        package: com.catzconnect.sdk
        pluginClass: CatzConnectPlugin
      ios:
        pluginClass: CatzConnectPlugin
